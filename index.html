<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amori Fati">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7">
<title>Amori Fati</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
:root{--blue-dk:#5a5a60;--sep:rgba(60,60,67,.13);--txt2:#8e8e93;--bg2:#f7f7fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;background:#000;color:#000;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
#splash{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .title{font-family:"Didot","Playfair Display","Times New Roman",serif;font-size:56px;font-weight:400;letter-spacing:2px;color:#1a1a1a;font-style:italic;opacity:0;transform:translateY(14px);animation:splashIn 1.4s cubic-bezier(.2,.9,.3,1) .3s forwards}
#splash .sub{font-size:12px;font-weight:300;letter-spacing:6px;color:#8e8e93;text-transform:uppercase;margin-top:18px;opacity:0;transform:translateY(10px);animation:splashIn 1.4s cubic-bezier(.2,.9,.3,1) .7s forwards}
@keyframes splashIn{to{opacity:1;transform:translateY(0)}}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:#000;overflow:hidden}
@media(min-width:600px){body{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#e8e8ed,#c7c7cc)}.phone{width:420px;height:min(880px,94vh);border-radius:46px;box-shadow:0 0 0 11px #1c1c1e,0 0 0 13px #3a3a3c,0 40px 90px rgba(0,0,0,.4)}}
.screen{
  position:relative;width:100%;height:100%;
  overflow:hidden;background:#000;
  padding-top:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;opacity:0;pointer-events:none;transform:scale(.94);transition:opacity .26s,transform .34s cubic-bezier(.32,.72,0,1);overflow:hidden}
.page.active{opacity:1;pointer-events:auto;transform:scale(1);z-index:2}
#page-home{background:#e5e5ea;background-size:cover;background-position:center;color:#1a1a1a}
.home-top{flex:none;padding:46px 22px 6px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;min-height:64px}
.home-title{font-family:"Didot","Playfair Display","Times New Roman",serif;font-size:30px;font-weight:400;font-style:italic;letter-spacing:1px;margin:0;color:#1a1a1a;text-shadow:0 1px 8px rgba(255,255,255,.6)}
.home-done-btn{font-size:13px;font-weight:500;color:#3a3a3c;padding:6px 14px;border-radius:16px;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none}
.home-done-btn.show{display:block}
.home-add-btn{position:absolute;left:14px;top:52px;width:40px;height:40px;border-radius:50%;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);color:#3a3a3c;font-size:24px;font-weight:300;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:20}
.home-add-btn.show{display:flex}
.home-add-btn:active{transform:scale(.9)}
.widget-zone{flex:none;padding:10px 14px 6px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.widget{position:relative;background:rgba(255,255,255,.72);border-radius:20px;min-height:120px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;transition:transform .16s;touch-action:none;display:flex}
.widget.col-span{grid-column:span 2}
.widget.jiggle{animation:jiggle .32s infinite}
@keyframes jiggle{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
.widget .w-del{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:#ff3b30;color:#fff;display:none;align-items:center;justify-content:center;font-size:14px;font-weight:600;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:5}
.widget.edit .w-del{display:flex}
.widget .w-content{font-size:15px;line-height:1.35;font-weight:500;color:#1a1a1a;word-break:break-word;flex:1;display:flex;align-items:center;padding:14px}
.widget .w-content.avatar-w{justify-content:center}
.widget .w-content img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.widget .w-content.sign-w{font-family:"Didot","Playfair Display",serif;font-style:italic;font-size:20px;justify-content:center;text-align:center}
.widget .w-content.app-w{flex-direction:column;gap:6px;justify-content:center}
.widget .w-content.app-w .app-name{font-size:12.5px;font-weight:600}
.widget.html-widget .widget-iframe{width:100%;height:100%;border:0;display:block;background:transparent;pointer-events:none;min-height:120px}
.widget .w-preview-icon img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.widget .w-preview-icon{width:40px;height:40px;border-radius:10px;background:#c7c7cc;color:#fff;display:grid;place-items:center;font-size:20px}
.home-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;padding:16px 14px 0;align-content:start;overflow-y:auto}
.app-icon{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:transform .16s;touch-action:none}
.app-icon:active{transform:scale(.9)}
.app-icon.jiggle{animation:jiggle .32s infinite}
.app-icon .del-btn{position:absolute;top:-5px;left:-5px;width:22px;height:22px;border-radius:50%;background:#ff3b30;color:#fff;display:none;align-items:center;justify-content:center;font-size:14px;font-weight:600;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:5}
.app-icon.edit .del-btn{display:flex}
.app-icon-img{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.14);position:relative;overflow:hidden;background:#c7c7cc}
.app-icon-img img{width:100%;height:100%;object-fit:cover}
.app-icon-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.app-icon span{font-size:11px;font-weight:500;color:#1a1a1a;text-shadow:0 1px 3px rgba(255,255,255,.8);max-width:70px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-dock{flex:none;margin:0 14px 18px;padding:10px 12px;border-radius:24px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);display:flex;justify-content:space-around;border:1px solid rgba(255,255,255,.5)}
.home-dock .app-icon span{display:none}
.home-dock .app-icon-img{width:52px;height:52px;border-radius:14px;font-size:24px}
.navbar{flex:none;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--sep)}
.nav-title{font-size:17px;font-weight:700}
.nav-count{font-size:13px;color:var(--txt2);margin-left:auto;margin-right:4px}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--blue-dk);flex:none}
.icon-btn:active{background:rgba(0,0,0,.08)}
.dc-nav{display:flex;align-items:center;justify-content:space-between;min-height:auto;padding:10px 8px 12px}
.dc-nav .icon-btn{width:40px;height:40px}
.dc-nav .nav-center{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0;cursor:pointer;padding:0 12px}
.dc-nav .nav-center .nav-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.dc-nav .nav-center .nav-name{font-size:13px;font-weight:600;line-height:1.1;color:#000;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint code{background:#f0f0f4;padding:1px 6px;border-radius:5px;font-size:11.5px;color:#5a5a60;font-family:ui-monospace,Menlo,monospace}
.messages{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:9px;background:#f7f7fa}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:84%;animation:pop .26s cubic-bezier(.2,1.1,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:9px 14px;border-radius:20px;font-size:15.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap;position:relative}
.msg.dream .bubble{background:#e5e5ea;color:#000;border-bottom-left-radius:6px}
.msg.me .bubble{background:linear-gradient(180deg,#5a5a60,#3a3a3c);color:#fff;border-bottom-right-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.msg-quote{padding:5px 9px;margin:-3px -6px 6px;background:rgba(0,0,0,.08);border-left:3px solid rgba(0,0,0,.25);border-radius:6px;font-size:12.5px;color:#5a5a60;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.me .msg-quote{background:rgba(255,255,255,.18);border-left-color:rgba(255,255,255,.5);color:rgba(255,255,255,.85)}
.msg-edited{font-size:10.5px;color:rgba(0,0,0,.35);margin-left:6px}
.msg.me .msg-edited{color:rgba(255,255,255,.55)}
.msg.recalled .bubble{background:transparent!important;color:#8e8e93!important;box-shadow:none!important;font-size:12.5px;font-style:italic;padding:4px 8px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;border-radius:8px!important}
.msg.recalled .bubble:active{background:rgba(0,0,0,.05)!important}
.avatar{flex:none;border-radius:50%;object-fit:cover;display:block}
.avatar-ph{display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;user-select:none;background:linear-gradient(140deg,#b0b0b8,#8e8e93)}
.avatar-ph.dream{background:linear-gradient(140deg,#8e8e93,#5a5a60)}
.avatar-ph.me{background:linear-gradient(140deg,#a8a8b0,#7a7a82)}
.typing{display:flex;gap:4px;align-items:center;padding:13px 15px}
.typing i{width:7px;height:7px;border-radius:50%;background:#b4b4bc;display:block;animation:blink 1.25s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.empty-chat{margin:auto;text-align:center;color:var(--txt2);padding:30px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-chat .ec-icon{width:64px;height:64px;border-radius:22px;background:linear-gradient(140deg,#c7c7cc,#8e8e93);display:grid;place-items:center;font-size:28px;color:#fff}
.empty-chat p{margin:0;font-size:13.5px;line-height:1.7}
.quote-bar{display:none;align-items:center;gap:8px;padding:8px 12px;margin:0 12px;background:#f0f0f4;border-left:3px solid #8e8e93;border-radius:8px;font-size:12.5px;color:#5a5a60;flex:none}
.quote-bar.show{display:flex}
.quote-bar .qtext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote-bar .qclose{color:#8e8e93;font-size:18px;line-height:1;padding:0 4px}
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 12px 10px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--sep)}
#input{flex:1;resize:none;border:0;outline:0;background:#f0f0f4;border-radius:19px;padding:9px 15px;font-size:15.5px;line-height:1.35;max-height:110px;min-height:38px}
#input::placeholder{color:#a1a1aa}
.round-btn{width:36px;height:36px;border-radius:50%;flex:none;background:#f0f0f4;display:grid;place-items:center;font-size:16px;color:#5a5a60}
.round-btn:active{transform:scale(.92);background:#e4e4ea}
.round-btn:disabled{opacity:.4}
.send-btn{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(180deg,#5a5a60,#3a3a3c);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.35;box-shadow:none}
.cat-bar{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 16px;background:#fff;border-bottom:.5px solid var(--sep);-webkit-overflow-scrolling:touch}
.cat-bar::-webkit-scrollbar{display:none}
.cat-chip{flex:none;padding:6px 14px;border-radius:14px;background:#f0f0f4;color:#3a3a3c;font-size:13px;font-weight:500;white-space:nowrap}
.cat-chip.picked{background:#3a3a3c;color:#fff}
.search-wrap{padding:10px 16px 6px;flex:none;background:#fff}
#cardSearch{width:100%;border:0;outline:0;background:#f0f0f4;border-radius:11px;padding:9px 14px;font-size:15px}
#cardSearch::placeholder{color:#a1a1aa}
.card-list{flex:1;overflow-y:auto;padding:6px 16px 100px;display:flex;flex-direction:column;gap:10px;background:#fff}
.card-item{position:relative;background:#fff;border-radius:16px;padding:14px 15px 13px 18px;overflow:hidden;border:1px solid rgba(0,0,0,.07);box-shadow:0 1px 2px rgba(0,0,0,.03);cursor:pointer}
.card-item:active{transform:scale(.985)}
.card-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3.5px;background:linear-gradient(180deg,#c7c7cc,#5a5a60)}
.card-text{font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:11px;padding:3px 9px;border-radius:8px;background:rgba(90,90,96,.08);color:#3a3a3c;font-weight:600}
.tag.gray{background:#f0f0f4;color:#8e8e93;font-weight:500}
.tag.cat{background:rgba(142,142,147,.16);color:#3a3a3c}
.card-del{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#c7c7cc;font-size:16px;opacity:0}
@media(hover:none){.card-del{opacity:1;color:#d9d9de}}
.fab{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;z-index:20;background:linear-gradient(135deg,#5a5a60,#3a3a3c);color:#fff;font-size:28px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.fab:active{transform:scale(.92)}
.empty-list{margin:60px auto;text-align:center;color:var(--txt2);font-size:14px;line-height:1.9;padding:0 30px}
.empty-list b{color:#3a3a3c}
.scroll{flex:1;overflow-y:auto;background:var(--bg2);padding:0 0 40px}
.sec-title{font-size:12.5px;font-weight:600;color:var(--txt2);padding:22px 20px 8px;letter-spacing:.3px;text-transform:uppercase}
.group{background:#fff;margin:0 16px;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;position:relative}
.row+.row::after{content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row .label{font-size:15.5px;flex:none}
.row .val{font-size:15px;color:var(--txt2);margin-left:auto;text-align:right}
.row-input{flex:1;border:0;outline:0;text-align:right;font-size:15.5px;background:none;color:#000;min-width:0}
.row-input::placeholder{color:#c0c0c6}
.chev{color:#c7c7cc;font-size:17px;margin-left:6px;flex:none}
.btn-row{display:block;width:100%;padding:14px 16px;text-align:left;font-size:15.5px;background:none}
.btn-row.danger{color:#ff3b30;text-align:center;font-weight:500}
.btn-row:active{background:#f5f5f7}
.hint{font-size:12px;color:var(--txt2);padding:8px 22px 0;line-height:1.6}
.range-row{padding:14px 16px;position:relative}
.range-row+.range-row::after{content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.range-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.range-head .label{font-size:15.5px}
.range-head .val{font-size:14px;color:#5a5a60}
input[type=range].range{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:#e5e5ea;outline:none;padding:0;margin:8px 0}
input[type=range].range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.06);cursor:pointer}
.icon-manage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
.icon-manage-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.icon-manage-item .app-icon-img{width:52px;height:52px;border-radius:14px}
.icon-manage-item .n{font-size:11px;color:#3a3a3c;max-width:64px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{position:relative;display:inline-block;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#e5e5ea;border-radius:16px;transition:background .25s;cursor:pointer}
.switch span::before{content:'';position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch input:checked + span{background:#8e8e93}
.switch input:checked + span::before{transform:translateX(20px)}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.36);z-index:50;opacity:0;pointer-events:none;transition:opacity .26s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(115%);transition:transform .34s cubic-bezier(.32,.72,0,1);max-height:88%;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.handle{width:38px;height:5px;border-radius:3px;background:#dcdce2;margin:4px auto 12px}
.sheet-title{font-size:18px;font-weight:700;margin:0 0 14px}
.field{width:100%;border:0;outline:0;background:#f0f0f4;border-radius:13px;padding:12px 14px;font-size:15.5px;line-height:1.5;resize:none;margin-bottom:10px;display:block}
.field::placeholder{color:#a8a8b0}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.btn-ghost,.btn-primary{flex:1;height:48px;border-radius:14px;font-size:16px;font-weight:600}
.btn-ghost{background:#f0f0f4;color:#3a3a3c}
.btn-primary{background:linear-gradient(135deg,#5a5a60,#3a3a3c);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn-ghost:active,.btn-primary:active{transform:scale(.975);opacity:.9}
.batch-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:11px;background:#f0f0f4;font-size:13.5px;color:#3a3a3c;font-weight:500;cursor:pointer}
.chip:active{background:#e4e4ea}
.chip.picked{background:#3a3a3c;color:#fff}
.chip input{accent-color:#5a5a60;margin:0;width:15px;height:15px}
.batch-count{font-size:12.5px;color:var(--txt2);padding:2px 4px 14px}
.batch-count b{color:#3a3a3c}
.icon-picker{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.icon-picker .emoji-opt{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#f0f0f4;font-size:22px;cursor:pointer;border:2px solid transparent;overflow:hidden}
.icon-picker .emoji-opt.picked{border-color:#5a5a60;background:#e5e5ea}
.icon-picker .emoji-opt img{width:100%;height:100%;object-fit:cover}
.color-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.color-swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.color-swatch.picked{border-color:#1a1a1a}
.avatar-preview-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 20px}

.bubble-menu.show{display:flex}
@keyframes menuPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.bubble-menu button{padding:12px 18px;text-align:left;font-size:15px;color:#1a1a1a}
.bubble-menu button+button{border-top:.5px solid rgba(0,0,0,.06)}
.bubble-menu button:active{background:#f0f0f4}

.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,14px);background:rgba(28,28,30,.92);color:#fff;font-size:13.5px;padding:9px 18px;border-radius:20px;z-index:99;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
</style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LS_KEY='dreamcard.v4';
const OLD_LS_KEYS=['dreamcard.v3','dreamcard.v2','dreamcard.v1'];
const APP_NAME='Amori Fati';
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'}
const DEFAULT_ICON="data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#f2f2f7"/><text x="50%" y="55%" font-family="Didot,Georgia,serif" font-style="italic" font-size="300" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">A</text></svg>`);
const DEFAULT_APPS=[
  {id:'dreamcard',name:'DreamCard',icon:'✦',img:null,bg:'#c7c7cc',dock:true,route:'dreamcard'},
  {id:'cards',name:'字卡',icon:'▤',img:null,bg:'#b0b0b8',dock:false,route:'cards'},
  {id:'settings',name:'设置',icon:'⚙',img:null,bg:'#8e8e93',dock:true,route:'settings'}
];
function defaultState(){
  return{
    me:{name:'我',avatar:null},dream:{name:'梦角',avatar:null,bio:''},
    cards:[],messages:[],
    apps:JSON.parse(JSON.stringify(DEFAULT_APPS)),widgets:[],
    settings:{
      preferTrigger:true,chatBg:null,bubbleCss:'',wallpaper:null,
      autoUpdate:false,appVersion:'1.4',appIcon:null,fullscreen:true,
      keepAlive:false,keepAliveAudio:null,
      thinkMin:1,thinkMax:10,readNoReply:false,
      recallEnabled:true,recallChance:15
    }
  };
}
let state=loadState();
let editingId=null,pickingFor=null,cardQuery='',activeCategory='all',busy=false;
let homeEditing=false,editingAppId=null,editingWidgetId=null;
let widgetDraft={type:'text',text:'',bg:'#ffffff',textColor:'#1a1a1a',avatar:null,appId:null,span2:false,html:'',css:''};
let keepAliveAudioEl=null,currentQuote=null,editingMsgId=null,currentBubbleMenu=null;

function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw)return mergeState(JSON.parse(raw));
    for(const k of OLD_LS_KEYS){
      const old=localStorage.getItem(k);
      if(old)return mergeState(JSON.parse(old));
    }
  }catch(e){console.warn(e)}
  return defaultState();
}
function mergeState(s){
  const base=defaultState();
  return{
    me:Object.assign({},base.me,s.me||{}),
    dream:Object.assign({},base.dream,s.dream||{}),
    cards:Array.isArray(s.cards)?s.cards:base.cards,
    messages:Array.isArray(s.messages)?s.messages:base.messages,
    apps:Array.isArray(s.apps)&&s.apps.length?s.apps:base.apps,
    widgets:Array.isArray(s.widgets)?s.widgets:base.widgets,
    settings:Object.assign({},base.settings,s.settings||{})
  };
}
function persist(){
  try{
    if(state.messages.length>400)state.messages=state.messages.slice(-400);
    localStorage.setItem(LS_KEY,JSON.stringify(state));
  }catch(e){toast('存储空间不足')}
}
function avatarHTML(src,name,kind,size){
  const style=`width:${size}px;height:${size}px`;
  if(src)return `<img class="avatar" style="${style}" src="${esc(src)}" alt="">`;
  const ch=(name||'?').trim().charAt(0)||'?';
  return `<div class="avatar avatar-ph ${kind}" style="${style}">${esc(ch)}</div>`;
}
let toastTimer=null;
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900);
}
function readImage(file,{size,quality,square}){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let W,H;
        if(square){
          W=H=size||256;
          const m=Math.min(img.width,img.height);
          const cv=document.createElement('canvas');cv.width=W;cv.height=H;
          const ctx=cv.getContext('2d');
          ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,W,H);
          resolve(cv.toDataURL('image/png'));
        }else{
          const maxW=size||900;
          const ratio=Math.min(1,maxW/img.width);
          W=Math.round(img.width*ratio);H=Math.round(img.height*ratio);
          const cv=document.createElement('canvas');cv.width=W;cv.height=H;
          const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,W,H);
          resolve(cv.toDataURL('image/jpeg',quality||0.85));
        }
      };
      img.onerror=reject;img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
function fmtSec(s){
  s=Math.round(s);
  if(s<60)return s+' 秒';
  const m=Math.floor(s/60),r=s%60;
  return r?`${m}分${r}秒`:`${m} 分钟`;
}
function applyPWAIcon(){
  const icon=state.settings.appIcon||DEFAULT_ICON;
  let link=document.querySelector('link[rel="apple-touch-icon"]');
  if(!link){link=document.createElement('link');link.rel='apple-touch-icon';document.head.appendChild(link)}
  link.href=icon;
  const display=state.settings.fullscreen!==false?'fullscreen':'standalone';
  const manifest={name:APP_NAME,short_name:APP_NAME,display,orientation:'portrait',background_color:'#ffffff',theme_color:'#f2f2f7',start_url:'.',scope:'.',icons:[
    {src:icon,sizes:'180x180',type:'image/png',purpose:'any'},
    {src:icon,sizes:'192x192',type:'image/png',purpose:'any'},
    {src:icon,sizes:'512x512',type:'image/png',purpose:'any'}
  ]};
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  const url=URL.createObjectURL(blob);
  let mlink=document.querySelector('link[rel="manifest"]');
  if(!mlink){mlink=document.createElement('link');mlink.rel='manifest';document.head.appendChild(mlink)}
  if(mlink._blobUrl)URL.revokeObjectURL(mlink._blobUrl);
  mlink._blobUrl=url;mlink.href=url;
}
function makeSilentWav(){
  const sr=8000,dur=1,n=sr*dur;
  const buf=new ArrayBuffer(44+n);const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n,true);ws(8,'WAVE');
  ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);
  v.setUint16(32,1,true);v.setUint16(34,8,true);
  ws(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function startKeepAlive(){
  if(!state.settings.keepAlive)return;
  stopKeepAlive();
  const src=state.settings.keepAliveAudio||makeSilentWav();
  keepAliveAudioEl=new Audio(src);
  keepAliveAudioEl.loop=true;keepAliveAudioEl.volume=0.001;keepAliveAudioEl.playsInline=true;
  keepAliveAudioEl.play().then(()=>toast('后台保活已启动')).catch(()=>toast('需要先点击页面再开启保活'));
}
function stopKeepAlive(){
  if(keepAliveAudioEl){try{keepAliveAudioEl.pause()}catch(e){}keepAliveAudioEl=null}
}
const TEMPLATES={

function go(name,push){
  if(push!==false){if(location.hash!=='#'+name)history.pushState(null,'','#'+name)}
  exitHomeEdit();closeBubbleMenu();
  $$('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));
  if(name==='dreamcard')renderDC();
  else if(name==='cards')renderCardsApp();
  else if(name==='settings')renderSettings();
  else if(name==='chat-settings')renderChatSettings();
  else renderHome();
}

function renderHome(){applyWallpaper();renderWidgets();renderHomeGrid();renderHomeDock()}
function applyWallpaper(){
  const el=$('#page-home');
  if(state.settings.wallpaper){el.style.backgroundImage=`url(${state.settings.wallpaper})`;el.style.backgroundSize='cover';el.style.backgroundPosition='center'}
  else{el.style.backgroundImage='';el.style.background='#e5e5ea'}
}
function renderWidgets(){
  const zone=$('#widgetZone');
  if(!state.widgets.length){zone.innerHTML='';return}
  zone.innerHTML=state.widgets.map(w=>widgetHTML(w)).join('');
  zone.querySelectorAll('[data-wdel]').forEach(el=>{
    el.onclick=e=>{e.stopPropagation();const id=el.dataset.wdel;
      if(confirm('删除这个小组件？')){state.widgets=state.widgets.filter(w=>w.id!==id);persist();renderWidgets()}}
  });
  zone.querySelectorAll('.widget').forEach(el=>{
    const w=state.widgets.find(x=>x.id===el.dataset.wid);
    el.onclick=e=>{
      if(e.target.dataset.wdel)return;
      if(homeEditing)openWidgetSheet(el.dataset.wid);
      else if(w&&w.type==='app'&&w.appId){const app=state.apps.find(a=>a.id===w.appId);if(app&&app.route)go(app.route)}
    };
  });
  attachDrag(zone.querySelectorAll('.widget'),'widget');
}
function widgetHTML(w){
  const cls='widget'+(w.span2?' col-span':'')+(w.type==='html'?' html-widget':'')+(homeEditing?' edit jiggle':'');
  const styleAttr=(w.type==='html'||w.bg==='transparent')?'':`background:${w.bg||'rgba(255,255,255,.72)'}`;
  let inner='';
  if(w.type==='text')inner=`<div class="w-content" style="color:${w.textColor||'#1a1a1a'}">${esc(w.text||'')}</div>`;
  else if(w.type==='sign')inner=`<div class="w-content sign-w" style="color:${w.textColor||'#1a1a1a'}">${esc(w.text||'')}</div>`;
  else if(w.type==='avatar')inner=`<div class="w-content avatar-w">${w.avatar?`<img src="${esc(w.avatar)}">`:`<div style="width:52px;height:52px;border-radius:50%;background:#c7c7cc;display:grid;place-items:center;color:#fff;font-size:22px">👤</div>`}</div>`;
  else if(w.type==='app'){
    const app=state.apps.find(a=>a.id===w.appId);
    if(app)inner=`<div class="w-content app-w"><div class="w-preview-icon" style="${app.img?'':'background:'+(app.bg||'#c7c7cc')}">${app.img?`<img src="${esc(app.img)}">`:esc(app.icon)}</div><div class="app-name">${esc(app.name)}</div></div>`;
    else inner=`<div class="w-content" style="color:#8e8e93;font-size:13px">应用不存在</div>`;
  }else if(w.type==='html'){
    const doc=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1a1a1a;box-sizing:border-box;overflow:hidden;height:100%}body{display:block}*{box-sizing:border-box}${w.css||''}</style></head><body>${w.html||''}</body></html>`;
    inner=`<iframe class="widget-iframe" srcdoc="${esc(doc)}" sandbox="allow-same-origin"></iframe>`;
  }
  return `<div class="${cls}" data-wid="${w.id}" style="${styleAttr}"><div class="w-del" data-wdel="${w.id}">×</div>${inner}</div>`;
}
function renderHomeGrid(){

function bindAppIcons(container){
  container.querySelectorAll('.app-icon').forEach(el=>{
    const appId=el.dataset.app;
    const app=state.apps.find(a=>a.id===appId);
    if(!app)return;
    el.onclick=e=>{
      if(e.target.dataset.appdel){
        e.stopPropagation();
        if(app.dock){toast('Dock 图标不可删除');return}
        if(!confirm(`删除「${app.name}」？`))return;
        state.apps=state.apps.filter(a=>a.id!==appId);persist();renderHome();return;
      }
      if(homeEditing)return;
      if(app.route)go(app.route);
      else if(app.url)window.open(app.url,'_blank');
      else toast('该应用还没有配置');
    };
  });
  attachDrag(container.querySelectorAll('.app-icon'),'app');
}
let longPressTimer=null,dragEl=null,dragKind=null,dragStartX=0,dragStartY=0;
function attachDrag(nodes,kind){
  nodes.forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      if(e.target.dataset.appdel||e.target.dataset.wdel)return;
      dragStartX=e.clientX;dragStartY=e.clientY;
      if(!homeEditing){
        longPressTimer=setTimeout(()=>{enterHomeEdit();startDrag(el,kind,e)},480);
      }else startDrag(el,kind,e);
    });
    el.addEventListener('pointermove',e=>{
      if(!dragEl||dragEl!==el){
        if(!homeEditing){
          const dx=e.clientX-dragStartX,dy=e.clientY-dragStartY;
          if(Math.abs(dx)>6||Math.abs(dy)>6)clearTimeout(longPressTimer);
        }
        return;
      }
      const dx=e.clientX-dragStartX,dy=e.clientY-dragStartY;
      if(Math.abs(dx)>4||Math.abs(dy)>4){
        clearTimeout(longPressTimer);
        el.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;
        el.style.zIndex=999;el.style.pointerEvents='none';
        const target=document.elementFromPoint(e.clientX,e.clientY);
        el.style.pointerEvents='';
        if(target){
          const tApp=target.closest('.app-icon');
          const tWid=target.closest('.widget');
          if(kind==='app'&&tApp&&tApp!==el)swapApps(el,tApp);
          if(kind==='widget'&&tWid&&tWid!==el)swapWidgets(el,tWid);
        }
      }
    });
    el.addEventListener('pointerup',()=>{
      clearTimeout(longPressTimer);
      if(dragEl===el){el.style.transform='';el.style.zIndex='';dragEl=null;dragKind=null}
    });
    el.addEventListener('pointercancel',()=>{
      clearTimeout(longPressTimer);
      if(dragEl===el){el.style.transform='';el.style.zIndex='';dragEl=null;dragKind=null}
    });
  });
}
function startDrag(el,kind,e){
  dragEl=el;dragKind=kind;
  dragStartX=e.clientX;dragStartY=e.clientY;
  if(el.setPointerCapture)el.setPointerCapture(e.pointerId);
}
function swapApps(elA,elB){
  const aId=elA.dataset.app,bId=elB.dataset.app;
  const aIdx=state.apps.findIndex(a=>a.id===aId);
  const bIdx=state.apps.findIndex(a=>a.id===bId);
  if(aIdx<0||bIdx<0)return;
  const tmp=state.apps[aIdx];state.apps[aIdx]=state.apps[bIdx];state.apps[bIdx]=tmp;
  persist();renderHomeGrid();renderHomeDock();
}
function swapWidgets(elA,elB){
  const aId=elA.dataset.wid,bId=elB.dataset.wid;
  const aIdx=state.widgets.findIndex(w=>w.id===aId);
  const bIdx=state.widgets.findIndex(w=>w.id===bId);
  if(aIdx<0||bIdx<0)return;
  const tmp=state.widgets[aIdx];state.widgets[aIdx]=state.widgets[bIdx];state.widgets[bIdx]=tmp;
  persist();renderWidgets();
}
function enterHomeEdit(){
  if(homeEditing)return;homeEditing=true;
  $('#homeDoneBtn').classList.add('show');
  $('#homeAddBtn').classList.add('show');
  renderWidgets();renderHomeGrid();renderHomeDock();
}
function exitHomeEdit(){
  if(!homeEditing)return;homeEditing=false;
  const d=$('#homeDoneBtn');if(d)d.classList.remove('show');
  const a=$('#homeAddBtn');if(a)a.classList.remove('show');
  renderWidgets();renderHomeGrid();renderHomeDock();

function renderChat(){
  const box=$('#messages');
  if(!state.messages.length){
    box.innerHTML=`<div class="empty-chat"><div class="ec-icon">✦</div><p><b>${esc(state.dream.name)}</b> 会用字卡回复你<br>发消息后点左下角 ↻ 请求回复</p></div>`;
    return;
  }
  box.innerHTML=state.messages.map(m=>renderMsg(m)).join('');
  bindBubbleEvents();
  scrollBottom();

function renderMsg(m){
  const isMe=m.from==='me';
  const avatar=isMe?'':avatarHTML(state.dream.avatar,state.dream.name,'dream',28);
  if(m.recalled){
    const name=isMe?(state.me.name||'我'):state.dream.name;
    if(m.revealed){
      return `<div class="msg ${isMe?'me':'dream'}" data-msgidx="${state.messages.indexOf(m)}">${avatar}<div class="bubble" data-revealed="1" style="opacity:.55;font-style:italic">${esc(m.recalledText||'')}<div style="font-size:10.5px;color:rgba(0,0,0,.4);margin-top:4px">（已撤回，点击收起）</div></div></div>`;
    }
    return `<div class="msg recalled ${isMe?'me':'dream'}">${avatar}<div class="bubble" data-recalled-id="${m.id}">${esc(name)}撤回了一条消息</div></div>`;
  }
  let quoteHTML='';
  if(m.quote)quoteHTML=`<div class="msg-quote">${esc(m.quote.text)}</div>`;
  const editedTag=m.edited?'<span class="msg-edited">(已编辑)</span>':'';
  return `<div class="msg ${isMe?'me':'dream'}">${avatar}<div class="bubble" data-msgid="${m.id}">${quoteHTML}${esc(m.text)}${editedTag}</div></div>`;
}
function bindBubbleEvents(){
  const box=$('#messages');
  box.querySelectorAll('.bubble[data-recalled-id]').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.recalledId;
      const m=state.messages.find(x=>x.id===id);
      if(!m)return;m.revealed=true;persist();renderChat();
    };
  });
  box.querySelectorAll('.bubble[data-revealed]').forEach(el=>{
    el.onclick=()=>{
      const parent=el.closest('.msg');
      const idx=+parent.dataset.msgidx;
      const m=state.messages[idx];
      if(m&&m.recalled){m.revealed=false;persist();renderChat()}
    };
  });
  box.querySelectorAll('.bubble[data-msgid]').forEach(el=>{
    let timer=null,moved=false;
    const start=()=>{moved=false;timer=setTimeout(()=>{if(moved)return;openBubbleMenu(el.dataset.msgid,el)},500)};
    const cancel=()=>clearTimeout(timer);
    el.addEventListener('pointerdown',start);
    el.addEventListener('pointerup',cancel);
    el.addEventListener('pointercancel',cancel);
    el.addEventListener('pointermove',()=>{moved=true;cancel()});
    el.addEventListener('contextmenu',e=>{e.preventDefault();openBubbleMenu(el.dataset.msgid,el)});
  });
}
function openBubbleMenu(msgId,bubbleEl){
  const m=state.messages.find(x=>x.id===msgId);
  if(!m)return;
  currentBubbleMenu={msgId,el:bubbleEl};
  const menu=$('#bubbleMenu');
  menu.querySelector('[data-act="edit"]').style.display=m.from==='me'?'':'none';
  menu.querySelector('[data-act="delete"]').style.display=m.from==='me'?'':'none';
  const rect=bubbleEl.getBoundingClientRect();
  const phone=$('.phone').getBoundingClientRect();
  const menuW=150;
  let left=rect.left-phone.left;
  let top=rect.bottom-phone.top+6;
  if(left+menuW>phone.width-8)left=phone.width-menuW-8;
  if(left<8)left=8;
  menu.style.left=left+'px';menu.style.top=top+'px';
  menu.classList.add('show');
}
function closeBubbleMenu(){$('#bubbleMenu').classList.remove('show');currentBubbleMenu=null}
function handleBubbleAction(act){
  const ctx=currentBubbleMenu;closeBubbleMenu();
  if(!ctx)return;
  const idx=state.messages.findIndex(x=>x.id===ctx.msgId);
  if(idx<0)return;
  const m=state.messages[idx];
  if(act==='copy'){navigator.clipboard&&navigator.clipboard.writeText(m.text||'').then(()=>toast('已复制')).catch(()=>toast('复制失败'));return}
  if(act==='quote'){currentQuote={id:m.id,text:m.text||'',from:m.from};showQuoteBar();toast('已引用');return}
  if(act==='edit'){if(m.from!=='me')return;editingMsgId=m.id;$('#editMsgText').value=m.text||'';showSheet($('#editMsgSheet'));setTimeout(()=>$('#editMsgText').focus(),320);return}
  if(act==='delete'){if(m.from!=='me')return;if(!confirm('删除这条消息？'))return;state.messages.splice(idx,1);persist();renderChat();toast('已删除');return}
}
function showQuoteBar(){
  if(!currentQuote){$('#quoteBar').classList.remove('show');return}
  const who=currentQuote.from==='me'?(state.me.name||'我'):state.dream.name;
  $('#quoteText').textContent=`${who}：${currentQuote.text}`;
  $('#quoteBar').classList.add('show');
}
function hideQuoteBar(){currentQuote=null;$('#quoteBar').classList.remove('show')}
function scrollBottom(){const box=$('#messages');requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight})}
function showTyping(){
  hideTyping();
  const el=document.createElement('div');
  el.className='msg dream';el.id='typing';
  el.innerHTML=`${avatarHTML(state.dream.avatar,state.dream.name,'dream',28)}<div class="bubble typing"><i></i><i></i><i></i></div>`;
  $('#messages').appendChild(el);scrollBottom();
}
function hideTyping(){const el=$('#typing');if(el)el.remove()}
function hasCards(){return state.cards.some(c=>c.text&&c.text.trim())}
function pickReply(userText){
  const cards=state.cards.filter(c=>c.text&&c.text.trim());
  if(!cards.length)return null;
  let pool=cards;
  if(activeCategory&&activeCategory!=='all'){
    const byCat=pool.filter(c=>(c.category||'')===activeCategory);
    if(byCat.length)pool=byCat;
  }
  if(state.settings.preferTrigger&&userText){
    const hit=pool.filter(c=>{
      const t=(c.trigger||'').split(/[,，、\s]+/).filter(Boolean);
      return t.some(k=>userText.includes(k));
    });
    if(hit.length)pool=hit;
  }
  const last=[...state.messages].reverse().find(m=>m.from==='dream'&&!m.recalled);
  let cand=pool.filter(c=>!last||c.text!==last.text);
  if(!cand.length)cand=pool;
  return cand[Math.floor(Math.random()*cand.length)];
}
function sendMessage(rawText){
  const text=(rawText??$('#input').value).trim();
  if(!text||busy)return;
  if(rawText==null){$('#input').value='';autoGrow()}
  const msg={id:uid(),from:'me',text,t:Date.now()};
  if(currentQuote){msg.quote={id:currentQuote.id,text:currentQuote.text,from:currentQuote.from};hideQuoteBar()}
  state.messages.push(msg);
  persist();renderChat();
}
function requestReply(){
  if(busy)return;
  if(!hasCards()){toast('字卡库是空的，先去「字卡」添加几张吧');return}
  if(state.settings.readNoReply&&Math.random()<0.35){toast(`${state.dream.name} 已读，没有回复`);return}
  const lastUser=[...state.messages].reverse().find(m=>m.from==='me');
  respond(lastUser?lastUser.text:'');
}
function respond(userText){
  busy=true;updateSendBtn();
  const card=pickReply(userText);
  const tMin=clamp(state.settings.thinkMin||0,0,60)*1000;
  const tMax=clamp(state.settings.thinkMax||10,60,600)*1000;
  const thinkDelay=tMin+Math.random()*Math.max(200,tMax-tMin);
  setTimeout(()=>{
    if(!card){
      state.messages.push({id:uid(),from:'dream',t:Date.now(),text:'（字卡库还是空的……去「字卡」里添加几张吧）'});
      persist();renderChat();busy=false;updateSendBtn();return;
    }
    showTyping();
    const typeTime=380+Math.min(card.text.length,24)*55;
    setTimeout(()=>{
      hideTyping();
      const msg={id:uid(),from:'dream',text:card.text,cardId:card.id,t:Date.now()};
      state.messages.push(msg);
      persist();renderChat();busy=false;updateSendBtn();
      if(state.settings.recallEnabled&&Math.random()<(state.settings.recallChance/100)){
        const recallDelay=800+Math.random()*1500;
        setTimeout(()=>{
          const m=state.messages.find(x=>x.id===msg.id);
          if(!m||m.recalled)return;
          m.recalled=true;m.recalledText=m.text;m.text='';m.revealed=false;
          persist();renderChat();
        },recallDelay);
      }
    },typeTime);
  },thinkDelay);
}

function getAllCategories(){

function renderCardsApp(){renderCatBar();renderCards()}
function renderCatBar(){
  const bar=$('#catBar');
  const cats=getAllCategories();
  const total=state.cards.length;
  let html=`<button class="cat-chip${activeCategory==='all'?' picked':''}" data-cat="all">全部 (${total})</button>`;
  cats.forEach(c=>{
    const n=state.cards.filter(x=>(x.category||'')===c).length;
    html+=`<button class="cat-chip${activeCategory===c?' picked':''}" data-cat="${esc(c)}">${esc(c)} (${n})</button>`;
  });
  bar.innerHTML=html;
  bar.querySelectorAll('.cat-chip').forEach(el=>{
    el.onclick=()=>{activeCategory=el.dataset.cat;renderCatBar();renderCards()};
  });

function renderCards(){
  const cnt=$('#cardsCount');
  if(cnt)cnt.textContent=`${state.cards.length} 张`;
  const list=$('#cardList');
  const q=cardQuery.trim().toLowerCase();
  let items=state.cards;
  if(activeCategory!=='all')items=items.filter(c=>(c.category||'')===activeCategory);
  if(q)items=items.filter(c=>c.text.toLowerCase().includes(q)||(c.trigger||'').toLowerCase().includes(q)||(c.category||'').toLowerCase().includes(q));
  if(!items.length){
    list.innerHTML=`<div class="empty-list">${state.cards.length?'这里还没有字卡':'<b>还没有字卡</b><br>点右下角 ＋ 粘贴或导入文档<br>每行会变成一张字卡'}</div>`;
    return;
  }
  list.innerHTML=items.map(c=>`
    <div class="card-item" data-id="${c.id}">
      <div class="card-text">${esc(c.text)}</div>
      <div class="card-meta">
        ${c.category?`<span class="tag cat">${esc(c.category)}</span>`:''}
        ${(c.trigger||'').split(/[,，、\s]+/).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
        <span class="tag gray">点击编辑</span>
      </div>
      <button class="card-del" data-del="${c.id}">×</button>
    </div>`).join('');
  list.querySelectorAll('.card-item').forEach(el=>{
    el.onclick=e=>{if(e.target.dataset.del)return;openCardSheet(el.dataset.id)};
  });
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const id=btn.dataset.del;
      if(confirm('删除这张字卡？')){state.cards=state.cards.filter(c=>c.id!==id);persist();renderCardsApp();toast('已删除')}
    };
  });
}

function openBatchSheet(){

function splitLines(text,skipEmpty,trim){
  let lines=String(text).replace(/\r\n?/g,'\n').split('\n');
  if(trim)lines=lines.map(l=>l.trim());
  if(skipEmpty)lines=lines.filter(l=>l.trim().length);
  return lines;
}
function currentBatchLines(){return splitLines($('#batchText').value,$('#chkSkipEmpty').checked,$('#chkTrim').checked)}
function updateBatchCount(){const n=currentBatchLines().length;$('#batchCount').innerHTML=`将添加 <b>${n}</b> 张字卡`}
function saveBatch(){
  const lines=currentBatchLines();
  if(!lines.length)return toast('没有可添加的内容');
  const trigger=$('#batchTrigger').value.trim();
  const category=$('#batchCategory').value.trim();
  const dedup=$('#chkDedup').checked;
  const exist=new Set(state.cards.map(c=>c.text.trim()));
  const newCards=[];let skipped=0;
  for(const text of lines){
    if(dedup&&exist.has(text)){skipped++;continue}
    exist.add(text);newCards.push({id:uid(),text,trigger,category});
  }
  if(!newCards.length){toast('这些字卡都已经存在了');return}
  state.cards=newCards.concat(state.cards);
  persist();closeSheets();renderCardsApp();
  toast(skipped?`已添加 ${newCards.length} 张，跳过 ${skipped} 张重复`:`已添加 ${newCards.length} 张字卡`);
}
function openCardSheet(id){
  editingId=id;
  const card=state.cards.find(c=>c.id===id);
  if(!card)return;
  $('#cardText').value=card.text;
  $('#cardTrigger').value=card.trigger||'';
  $('#cardCategory').value=card.category||'';
  const cats=getAllCategories();
  $('#catList2').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  showSheet($('#cardSheet'));
  setTimeout(()=>$('#cardText').focus(),320);
}
function saveCard(){
  const text=$('#cardText').value.trim();
  if(!text)return toast('字卡内容不能为空');
  const trigger=$('#cardTrigger').value.trim();
  const category=$('#cardCategory').value.trim();
  const c=state.cards.find(c=>c.id===editingId);
  if(c){c.text=text;c.trigger=trigger;c.category=category}
  persist();closeSheets();renderCardsApp();toast('已保存');
}

async function importDoc(file){
  const ext=file.name.toLowerCase().split('.').pop();
  try{
    let text='';
    if(ext==='docx')text=await readDocx(file);
    else if(ext==='pdf')text=await readPdf(file);
    else if(ext==='doc'){toast('旧版 .doc 暂不支持，另存为 .docx 或 .txt 吧');return}
    else{
      text=await readText(file);
      if(ext==='json'){
        try{
          const j=JSON.parse(text);
          const arr=Array.isArray(j)?j:(j&&Array.isArray(j.cards)?j.cards:[]);
          text=arr.map(x=>typeof x==='string'?x:(x&&x.text)||'').filter(Boolean).join('\n');
        }catch(e){}
      }
    }
    const box=$('#batchText');
    const existing=box.value.replace(/\s+$/,'');
    box.value=(existing?existing+'\n':'')+text.replace(/\r\n?/g,'\n');
    updateBatchCount();toast('已读取文档，确认后点「添加」');
  }catch(err){
    console.error(err);toast('文档读取失败：'+(err.message||'未知错误'));
  }
}
function readText(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=e=>resolve(String(e.target.result||''));
    r.onerror=reject;r.readAsText(file,'utf-8');
  });
}
async function readDocx(file){
  if(!window.JSZip)throw new Error('缺少 docx 解析库');
  const buf=await file.arrayBuffer();
  const zip=await JSZip.loadAsync(buf);
  const doc=zip.file('word/document.xml');
  if(!doc)throw new Error('不是有效的 docx');
  let xml=await doc.async('string');
  xml=xml.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<w:br\/>/g,'\n');
  xml=xml.replace(/<[^>]+>/g,'');
  xml=xml.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
  return xml;
}
async function readPdf(file){
  if(!window.pdfjsLib)throw new Error('缺少 PDF 解析库');
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let out='';
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    let lastY=null,line='';
    for(const item of content.items){
      const y=item.transform[5];
      if(lastY!==null&&Math.abs(y-lastY)>4){out+=line+'\n';line=''}
      line+=item.str;lastY=y;
    }
    if(line)out+=line+'\n';
    out+='\n';
  }
  return out;
}

function exportData(){
  const data=JSON.stringify(state,null,2);

function importData(file){

    }catch(err){toast('导入失败：文件格式不正确')}
  };
  r.readAsText(file);
}
